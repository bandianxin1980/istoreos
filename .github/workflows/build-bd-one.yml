name: Build BD-ONE iStoreOS 24.10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: 24.10

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip qemu-utils rsync scons \
          squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy bd-one.dtb
        run: |
          cp -f bd-one.dtb target/linux/rockchip/armv8/dts/bd-one.dtb

      - name: Load config
        run: |
          cp -f config.seed .config
          make defconfig

      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      - name: Collect files
        run: |
          mkdir -p firmware
          cp bin/targets/rockchip/armv8/*.img firmware/
          cp bin/targets/rockchip/armv8/*.img.gz firmware/
          ls -lh firmware/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bd-one-istoreos-24.10
          path: firmware/
          retention-days: 7
