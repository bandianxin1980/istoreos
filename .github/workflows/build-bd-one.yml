name: Build BD-ONE iStoreOS 24.10
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: istoreos-24.10

      - name: Install full dependencies
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-elftools \
          qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Replace bd-one.dtb
        run: |
          cp -f bd-one.dtb target/linux/rockchip/armv8/dts/bd-one.dtb

      - name: Load config.seed
        run: |
          cp -f config.seed .config
          make defconfig

      - name: Start build
        run: |
          make -j$(nproc) V=s

      - name: Collect firmware
        run: |
          mkdir -p firmware
          cp -f bin/targets/rockchip/armv8/*.img firmware/ 2>/dev/null || true
          cp -f bin/targets/rockchip/armv8/*.img.gz firmware/ 2>/dev/null || true
          ls -lh firmware/

      - name: Upload firmware to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: bd-one-istoreos-24.10-firmware
          path: firmware/
          retention-days: 7
